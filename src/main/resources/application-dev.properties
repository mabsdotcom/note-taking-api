# Development profile: in-memory H2 database, recreated on every start
spring.datasource.url=jdbc:h2:mem:notesdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Insert demo users, categories, tags and notes
app.seed.enabled=true

logging.level.com.notesapp=DEBUG
