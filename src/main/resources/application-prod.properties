# Production profile: PostgreSQL
# Required environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notesdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.seed.enabled=${SEED_DATA:false}

logging.level.root=INFO
logging.level.com.notesapp=INFO
