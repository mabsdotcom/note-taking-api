# ============================================================
# Shared settings. Profile files override these:
#   application-dev.properties  (default) -> in-memory H2, demo data, H2 console
#   application-prod.properties           -> PostgreSQL, secrets from environment variables
# ============================================================
spring.application.name=note-taking-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- JPA ---
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Pagination ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Server ---
server.port=${PORT:8080}

# --- JWT (dev-only fallback secret: ALWAYS set JWT_SECRET, 32+ chars, outside development) ---
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
# 15 minutes
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# 7 days
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- CORS (comma separated frontend origins) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# --- Scheduled tasks ---
app.trash.retention-days=${TRASH_RETENTION_DAYS:30}
# every day at 03:00
app.trash.cleanup-cron=0 0 3 * * *
# every day at 03:30
app.tokens.cleanup-cron=0 30 3 * * *

# --- Demo data (enabled in the dev profile) ---
app.seed.enabled=false

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.api-docs.path=/v3/api-docs
