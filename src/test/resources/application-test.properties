# Test profile: isolated in-memory H2, no demo data, no scheduled jobs
spring.datasource.url=jdbc:h2:mem:notes-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

app.jwt.secret=test-secret-key-that-is-long-enough-for-hs256
app.jwt.access-token-expiration-ms=600000
app.jwt.refresh-token-expiration-ms=3600000
app.seed.enabled=false
app.scheduling.enabled=false
